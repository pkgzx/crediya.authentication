server:
  port: 8080
spring:
  application:
    name: "authentication"
  devtools:
    add-properties: false
  profiles:
    include: null
#  security:
#    oauth2:
#      resourceserver:
#        jwt:
#          issuer-uri: "https://idp.example.com/issuer"
#          client-id: "myclientid"
  sql:
    init:
      mode: always
#jwt:
#  json-exp-roles: "/roles"
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"

logging:
  file:
    name: logs/app.log
  level:
    root: INFO
    com.crediya.authentication: TRACE
#    org.springframework.r2dbc.core: DEBUG
#    io.r2dbc.postgresql: DEBUG

routes:
  paths:
    permission:
      create: "api/v1/permissions"
      list: "api/v1/permissions"
    role:
      create: "api/v1/roles"
      list: "api/v1/roles"
    type-identification:
      list: "api/v1/type-identifications"
      create: "api/v1/type-identifications"
    user:
        create: "api/v1/users"
        getByEmail: "api/v1/users/email/{email}"
    auth:
      sign-in: "api/v1/auth/sign-in"
      validate-token: "api/v1/auth/validate-token"
adapters:
  r2dbc:
    host: ${DB_HOST}
    port: ${DB_PORT}
    database: ${DB_NAME}
    schema: ${DB_SCHEMA}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

springdoc:
  swagger-ui:
    path: /api/docs
  version: 1.0.0
  title: Authentication Service API
  description: API documentation for the Authentication Service
  license:
    name: GNU GENERAL PUBLIC LICENSE
    url: https://www.gnu.org/licenses/gpl-3.0.txt

currency:
  api:
    base-url: "https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/cop.json"

jwt:
  secret: "YTAyMzA3ZjctODc4Ny00M2YzLWJkN2UtNTMwY2YzYzZjZWE3"
  expiration: 3600