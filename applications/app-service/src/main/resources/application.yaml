server:
  port: 8080
spring:
  application:
    name: "authentication"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
#  security:
#    oauth2:
#      resourceserver:
#        jwt:
#          issuer-uri: "https://idp.example.com/issuer"
#          client-id: "myclientid"
  sql:
    init:
      mode: never
jwt:
  json-exp-roles: "/roles"
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"

logging:
  file:
    name: logs/app.log
  level:
    root: INFO
    com.crediya.authentication: TRACE

routes:
  paths:
    permission:
      create: "api/v1/permissions"
      allPermissions: "api/v1/permissions"

adapters:
  r2dbc:
    host: ${DB_HOST}
    port: ${DB_PORT}
    database: ${DB_NAME}
    schema: ${DB_SCHEMA}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

springdoc:
  swagger-ui:
    path: /api/docs
  version: 1.0.0
  title: Authentication Service API
  description: API documentation for the Authentication Service
  license:
    name: GNU GENERAL PUBLIC LICENSE
    url: https://www.gnu.org/licenses/gpl-3.0.txt